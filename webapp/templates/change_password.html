<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZapShot — Criar nova senha</title>
  <style>
    :root {
      --bg: #070D1F;
      --card: #0f1829;
      --border: #1e2d4a;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #3b82f6;
      --green: #00e5a0;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 420px;
      max-width: 95vw;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #00e5a0, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .info-box {
      background: rgba(59,130,246,.1);
      border: 1px solid rgba(59,130,246,.3);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #93c5fd;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border .2s;
    }
    input:focus { border-color: var(--accent); }
    .error {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fca5a5;
      font-size: 13px;
      margin-top: 14px;
    }
    button[type=submit] {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: linear-gradient(135deg, #00e5a0, #3b82f6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    button[type=submit]:hover { opacity: .9; }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>⚡ ZapShot</h1>
      <p>Primeiro acesso — crie sua senha</p>
    </div>

    <div class="info-box">
      🔐 Por segurança, você precisa criar uma senha pessoal antes de continuar.<br>
      Olá, <strong>{{ user_name }}</strong>! Escolha uma senha que só você saiba.
    </div>

    <form method="POST">
      <label>Nova senha</label>
      <input type="password" name="new_password" placeholder="Mínimo 6 caracteres" required autofocus>
      <p class="hint">Use letras, números e símbolos para uma senha mais segura.</p>

      <label>Confirmar nova senha</label>
      <input type="password" name="confirm" placeholder="Repita a senha" required>

      {% if error %}
      <div class="error">❌ {{ error }}</div>
      {% endif %}

      <button type="submit">✅ Salvar senha e entrar</button>
    </form>
  </div>
</body>
</html>
